# Version updates are disabled (open-pull-requests-limit: 0).
# Security updates are bundled into one grouped PR per ecosystem.
version: 2
updates:
- package-ecosystem: maven
  directory: /swingbits
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    maven-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    github_actions-security:
      applies-to: security-updates
      patterns:
      - '*'
